<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vėliava</title>
    <style>
      body {
        background-color: bisque;
        margin: 0;
        padding: 0;
      }

      .veliava {
        height: 300px;
        width: 500px;
        margin: 20pt auto 20pt auto;
      }

      h1 {
        text-align: center;
      }

      #geltona {
        background-color: #fdb913;
      }

      #zalia {
        background-color: #006a44;
      }

      #raudona {
        background-color: #c1272d;
      }

      #balta {
        background-color: #ffffff;
      }

      #geltona,
      #zalia,
      #raudona {
        height: 100px;
      }

      .indonezija #balta,
      .indonezija #raudona {
        height: 150px;
      }
    </style>
  </head>
  <body>
    <h1>Lietuva</h1>
    <div class="veliava">
      <div id="geltona"></div>
      <div id="zalia"></div>
      <div id="raudona"></div>
    </div>

    <h1>Indonezija</h1>
    <div class="veliava indonezija">
      <div id="raudona"></div>
      <div id="balta"></div>
    </div>
  </body>
</html>
